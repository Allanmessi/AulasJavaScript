<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Esse é uma página modelo">
    <meta name="keywords" content="sites, web, desenvolvimento backend">

    <link rel="icon" type="image/jpeg" href="img/favicon.jpeg">
    <link rel="stylesheet" href="css/style.css">
    <title>Exercicio 04 - JAVASCRIPT</title>
</head>

<body>
    <h1>Integrando os recursos de interatividade do JS</h1>
    <hr>
    <script>
        window.alert("Seja bem-vindo ao site");
        let name = window.prompt("QUAL SEU NOME? ");
        window.alert(name);
        console.log(name);
        let resposta = window.confirm("Você deseja sair da página? ");
        console.log(resposta);
        if (resposta == true) {
            window.close()
        } else {
            window.alert("Aproveite meu site, " + name);
        }
    </script>

</body>

</html>
