<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Esse é uma página modelo">
    <meta name="keywords" content="sites, web, desenvolvimento backend">
    <meta name="author" content="Allan, @allanmoreira">
    <link rel="icon" type="image/jpeg" href="img/favicon.jpeg">
    <link rel="stylesheet" href="css/style.css">
    <title>DESAFIO 02 - JAVASCRIPT</title>
</head>

<body>
    <h1>DESAFIO_02 <mark>ALERT</mark></h1>
    <p id="resultado" style="font-size: 50px; font-weight: bold;"></p>
    <hr>
    <script>
        window.alert("Seja bem-vindo ao site");
        let numero = parseFloat(window.prompt("Digite o primeiro número"))
        console.log(numero)
        let numero2 = parseFloat(window.prompt("Digite o segundo número"))
        console.log(numero2)
        let resposta = window.confirm("Deseja somar? ")
        let resultado = 0

        if(resposta==true){
            resultado = (numero + numero2)
            console.log("o resultado da sua soma é: " +resultado)
        }
        else{
            window.confirm = ("Agora vamos subtrair")
            resultado = (numero - numero2)
            console.log("o resultado da sua subtração é: " +resultado)  
        }
        document.getElementById("resultado").innerHTML=resultado;
    </script>

</body>
</html>
