<body>
    <h1>INTERAÇÃO JS COM FORMS<mark> DO HTML</mark></h1>
    <hr>
    <input type="button" onclick="triste();" value="FELIZ">
    <input type="button" onclick="feliz();" value="TRISTE">
    <img src="img/imgtriste.webp" alt="triste" title="triste">
    <script>
        function triste() {
            var tag_img = document.getElementsByTagName('img')[0]
            console.log(tag_img)
            tag_img.src = "img/feliz.webp";

        }
        function feliz() {
            var tag_img = document.getElementsByTagName('img')[0]
            console.log(tag_img)
            tag_img.src = "img/triste.webp";

        }
    </script>
</body>
